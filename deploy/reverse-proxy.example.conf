# Nginx 反向代理示例（占位域名与端口，无任何真实秘密）。
# 目标：把公网 HTTPS 入口固定到本机 MCP 网关 8765 / 管理网站 8788。
# 证书请用 certbot / ACME 自行签发，并把 mcp.example.com 换成你的域名。
#
# 注意：网关自身仍强制 Bearer（/mcp、/run_command 等），管理网站有独立登录；
# 只有 /files/download 由 HMAC 签名 token 授权，反代不得注入或剥离 Authorization 头。

server {
    listen 80;
    server_name mcp.example.com admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # SSE / MCP streamable HTTP 必须关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 16m;   # 单个 base64 分片上限见 MCP_FILE_CHUNK_BYTES

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # MCP / REST / 签名下载链接全部指向网关
    location / {
        proxy_pass http://127.0.0.1:8765;
    }

    # MCP / REST / 签名下载链接全部指向网关；网关不做路径改写。
}

# 管理网站使用独立主机名，避免与网关的 /static、/api、/mcp 路径冲突。
# 建议再套一层来源 IP 白名单或 VPN；它自身也有独立登录鉴权。
server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:8788;
    }
}
