name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.txt -r requirements-dev.txt
      - name: Validate deployment shell scripts
        run: |
          bash -n scripts/deploy-docker.sh scripts/install-native.sh docker/entrypoint.sh
      - name: Lint (syntax / undefined names)
        run: ruff check .
      - name: Tests
        run: pytest tests -q
